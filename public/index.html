<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임동아리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Press+Start+2P&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== 로딩 화면 ===== -->
<div id="loadingScreen" class="loading-screen">
  <svg class="loading-controller" viewBox="0 0 64 28" aria-hidden="true">
    <rect x="12" y="0"  width="40" height="4" class="body"/>
    <rect x="4"  y="4"  width="56" height="4" class="body"/>
    <rect x="0"  y="8"  width="64" height="16" class="body"/>
    <rect x="4"  y="24" width="56" height="4" class="body"/>
    <rect x="12" y="24" width="40" height="4" class="body"/>
    <rect x="12" y="8"  width="4" height="4" class="pad"/>
    <rect x="8"  y="12" width="4" height="4" class="pad"/>
    <rect x="12" y="12" width="4" height="4" class="pad"/>
    <rect x="16" y="12" width="4" height="4" class="pad"/>
    <rect x="12" y="16" width="4" height="4" class="pad"/>
    <rect x="44" y="8"  width="4" height="4" class="btn"/>
    <rect x="48" y="16" width="4" height="4" class="btn"/>
  </svg>
  <div class="loading-bar-track"><div class="loading-bar-fill"></div></div>
  <p class="loading-text">LOADING...</p>
</div>

<!-- ===== 배경음악 켜기/끄기 버튼 ===== -->
<button id="musicToggle" class="music-toggle" title="배경음악 켜기/끄기">🔇</button>
<audio id="bgmAudio" src="bgm.mp3" loop preload="auto"></audio>
<audio id="bgmAudio" src="bgm.mp3" volume="0.005"></audio>

<div class="scanline"></div>

<header class="header">
  <div class="header-frame">
    <div class="header-frame-inner">
      <svg class="controller-icon" viewBox="0 0 64 28" aria-hidden="true">
        <!-- 컨트롤러 본체 (알약 모양, 위아래 살짝 좁힘) -->
        <rect x="12" y="0"  width="40" height="4" class="body"/>
        <rect x="4"  y="4"  width="56" height="4" class="body"/>
        <rect x="0"  y="8"  width="64" height="16" class="body"/>
        <rect x="4"  y="24" width="56" height="4" class="body"/>
        <rect x="12" y="24" width="40" height="4" class="body"/>

        <!-- 왼쪽 십자 방향키 -->
        <rect x="12" y="8"  width="4" height="4" class="pad"/>
        <rect x="8"  y="12" width="4" height="4" class="pad"/>
        <rect x="12" y="12" width="4" height="4" class="pad"/>
        <rect x="16" y="12" width="4" height="4" class="pad"/>
        <rect x="12" y="16" width="4" height="4" class="pad"/>

        <!-- 오른쪽 버튼 2개 -->
        <rect x="44" y="8"  width="4" height="4" class="btn"/>
        <rect x="48" y="16" width="4" height="4" class="btn"/>
      </svg>
      <h1 class="title">게임동아리</h1>
      <div class="title-rule"></div>
      <p class="subtitle">EST. 2025</p>
    </div>
  </div>
</header>

<!-- ===== 로그인 / 회원가입 화면 ===== -->
<div id="authScreen" class="auth-screen">
  <div class="box auth-box">

    <div class="auth-tabs">
      <button class="auth-tab-btn active" data-auth="login">로그인</button>
      <button class="auth-tab-btn" data-auth="signup">회원가입</button>
    </div>

    <form id="loginForm" class="auth-form">
      <label class="label">아이디</label>
      <input type="text" id="loginUsername" class="input" required autocomplete="username">
      <label class="label">비밀번호</label>
      <input type="password" id="loginPassword" class="input" required autocomplete="current-password">
      <p class="error-msg" id="loginError"></p>
      <button type="submit" class="btn">로그인 ▶</button>
    </form>

    <form id="signupForm" class="auth-form hidden">
      <label class="label">아이디</label>
      <input type="text" id="signupUsername" class="input" required autocomplete="username">
      <label class="label">비밀번호 (4자 이상)</label>
      <input type="password" id="signupPassword" class="input" required autocomplete="new-password">
      <label class="label">닉네임</label>
      <input type="text" id="signupNickname" class="input" required placeholder="단톡방에서 쓰는 닉네임">
      <label class="label">이름</label>
      <input type="text" id="signupName" class="input" required placeholder="실제 이름">
      <p class="error-msg" id="signupError"></p>
      <button type="submit" class="btn">회원가입 ▶</button>
    </form>

  </div>
</div>

<!-- ===== 메인 화면 (로그인 후) ===== -->
<div id="mainApp" class="hidden">

  <div class="userbar" id="userbar">
    <span class="userbar-text">👋 <strong id="myNickname"></strong>님 환영해요</span>
    <button id="logoutBtn" class="btn-link">로그아웃</button>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="dict"><span class="cursor">▶</span>사전</button>
    <button class="tab-btn" data-tab="translate"><span class="cursor">▶</span>번역기</button>
    <button class="tab-btn" data-tab="members"><span class="cursor">▶</span>멤버 리스트</button>
  </nav>

  <main class="content">

    <!-- 사전 -->
    <section class="panel active" id="panel-dict">
      <div class="box">
        <input type="text" id="dictSearch" class="input" placeholder="단어 검색... (예: 산스)">
        <div class="term-list" id="dictList"></div>
      </div>
    </section>

    <!-- 번역기 -->
    <section class="panel" id="panel-translate">
      <div class="box">
        <label class="label">원문 입력</label>
        <textarea id="translateInput" class="textarea" placeholder="여기에 채팅 내용을 붙여넣으세요..."></textarea>
        <button id="translateBtn" class="btn">번역하기 ▶</button>
        <label class="label">번역 결과</label>
        <div id="translateOutput" class="output-box">결과가 여기에 표시됩니다</div>
      </div>
    </section>

    <!-- 멤버 프로필 -->
    <section class="panel" id="panel-members">
      <div class="box">
        <p class="hint" id="memberHint">내 프로필 카드에는 연필 아이콘이 떠요. 눌러서 닉네임/이름/색깔을 바꿀 수 있어요.</p>
        <div class="member-grid" id="memberList"></div>
      </div>
    </section>

  </main>

  <footer class="footer">* DETERMINATION *</footer>
</div>

<!-- ===== 프로필 수정 모달 ===== -->
<div id="editModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3 class="modal-title">프로필 수정</h3>

    <label class="label">프로필 사진</label>
    <div class="avatar-edit-row">
      <div class="avatar-square avatar-preview" id="avatarPreview"></div>
      <div class="avatar-edit-actions">
        <label for="avatarFileInput" class="btn-outline avatar-upload-btn">사진 선택</label>
        <input type="file" id="avatarFileInput" accept="image/*" class="hidden">
        <button id="removeAvatarBtn" class="btn-link hidden">사진 삭제</button>
      </div>
    </div>
    <p class="error-msg" id="avatarError"></p>

    <label class="label">아바타 색상 <span class="label-note">(사진이 없을 때 표시돼요)</span></label>
    <div class="color-picker" id="colorPicker"></div>
    <label class="label">닉네임</label>
    <input type="text" id="editNickname" class="input">
    <label class="label">이름</label>
    <input type="text" id="editName" class="input">
    <p class="error-msg" id="editError"></p>
    <div class="modal-actions">
      <button id="editCancelBtn" class="btn-outline">취소</button>
      <button id="editSaveBtn" class="btn">저장 ▶</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
